<!-- <app-navbar></app-navbar> -->
<div class="container-flex">
  <div class="row">
    <div class="col-12 col-sm-12 col-md-12 col-lg-12 mt-2">
      
      <!-- Adicionamos uma div envolvente para o mapa e o card -->
      <div class="map-container">

        <!-- Mapa -->
        <div id="map" class="mapa"></div>

        <div class="card floating-card end">
          <form [formGroup]="formFilter" (ngSubmit)="filterCityAndDate()">
            <div class="row">
              <div class="col-12 col-sm-12 col-md-12 col-lg-12">
                <label class="form-label">Data</label>
                  <input class="form-control" type="date" formControlName="date">
                </div>
              </div>
            
            <div class="row">
              <div class="col-12 col-sm-12 col-md-12 col-lg-12 mt-2">
                <label class="form-label">Município</label>
                <select class="form-select" formControlName="codeCity">
                  <option value="" disabled selected>Selecione uma cidade</option>
                  <option *ngFor="let cidade of cidades" [value]="cidade.cdMunicipio">{{ cidade.nmMunicipio }}</option>
                </select>
              </div>
            </div>
            
            <div class="row">
              <div class="col-12 col-sm-12 col-md-12 col-lg-12 mt-4">
                <button type="submit" class="btn" style="width: 100%;">Aplicar Filtro</button>
              </div>
            </div>
          </form>
          <div class="row">
            <div class="col-12 col-sm-12 col-md-12 col-lg-12 mt-4 mb-2">
              <button (click)="clearFilterAndLoadAll()" class="btn" style="width: 100%;">Limpar Filtro</button>
            </div>
          </div>
        </div>

        <div class="info-container">
          <div>
            <strong>Quantidade de focos:</strong>
            <div class="info-item">
              <span [ngClass]="{ 'highlight': quantidadeFocos !== undefined && quantidadeFocos !== null }">{{ quantidadeFocos || 0 }}</span>
            </div>
          </div>
        </div>

        <div class="logo-container">
          <div class="logo">
            <img src="/assets/images/logoGRF.png" alt="Logo Green Future" style="max-width: 400px; max-height: 300px;">
          </div>
          <div class="btn-info">
            <button class="btn-saiba-mais" [routerLink]="'/saiba-mais'">Saiba Mais</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed top-0 end-0 p-3" *ngIf="showToast">
  <div id="liveToast" class="toast fade show bg-danger" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <strong class="me-auto">Erro</strong>
    </div>
    <div class="toast-body">
      Os campos do formulário são obrigatórios.
    </div>
  </div>
</div>
